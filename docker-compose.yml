services:
  cloud-ai:
    build: .
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/cloud-ai.db
      # Em localhost sem HTTPS, o cookie "Secure" não funciona. Remova esta linha quando publicar com HTTPS.
      COOKIE_SECURE: "false"
    volumes:
      - cloud-ai-data:/data
    restart: unless-stopped

volumes:
  cloud-ai-data:
